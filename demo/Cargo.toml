[package]
name = "gpui-plot-demo"
description = "A gallery of gpui-plot charts and interactions."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "gpui_plot_demo"
path = "src/lib.rs"

[[bin]]
name = "gpui-plot-demo"
path = "src/main.rs"

[dependencies]
gpui-plot.workspace = true
gpui-kit.workspace = true
chrono.workspace = true
serde_json = "1"

[dev-dependencies]
# gpui-kit is the single source of GPUI; its `test-support` feature provides the
# `TestAppContext`/`TestDispatcher` harness the interaction tests drive. Kept in
# dev-dependencies so the app binary does not enable it.
gpui-kit = { version = "0.8.1", features = ["test-support"] }
image = "0.25"
