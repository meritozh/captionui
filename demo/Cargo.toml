[package]
name = "gpui-plot-demo"
description = "A gallery of gpui-plot charts and interactions."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "gpui_plot_demo"
path = "src/lib.rs"

[[bin]]
name = "gpui-plot-demo"
path = "src/main.rs"

[dependencies]
gpui-plot.workspace = true
gpui-kit.workspace = true
chrono.workspace = true

[dev-dependencies]
# The headless renderer the snapshot example draws through. GPUI Kit's own
# `test-support` feature would pull in a second dependency set that conflicts
# with this workspace's, so the platform crates are depended on directly.
gpui-pre = { version = "=0.3.10", package = "gpui-pre", features = ["test-support"] }
gpui-pre-platform = { version = "=0.3.10", package = "gpui-pre-platform", features = ["test-support"] }
image = "0.25"
